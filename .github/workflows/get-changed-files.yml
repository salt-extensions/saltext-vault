---
on:
  workflow_call:
    outputs:
      changed-files:
        description: "Changed file JSON output from dorny/paths-filter"
        value: ${{ jobs.get-changed-files.outputs.changed-files }}
      changed-files-json:
        description: "Changed file JSON output from dorny/paths-filter"
        value: ${{ jobs.get-changed-files.outputs.changed-files-json }}

permissions:
  contents: read  # for dorny/paths-filter to fetch a list of changed files
  pull-requests: read  # for dorny/paths-filter to read pull requests

jobs:
  get-changed-files:
    name: Get Changed Files
    runs-on: ubuntu-24.04
    outputs:
      changed-files: ${{ toJSON(steps.changed-files.outputs) }}
      changed-files-json: ${{ steps.changed-files-json.outputs.all_files }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get Changed Files
        id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          token: ${{ github.token }}
          list-files: escape
          filters: |-
            repo:
              - added|modified:
                - '**'
            deleted:
              - deleted:
                - '**'
            pre-commit:
              - added|modified|deleted:
                - .pre-commit-hooks/**
                - .pre-commit-config.y?(a)ml
                - .pylintrc
                - pyproject.toml
            # If files in this filter change, a test release to TestPyPI
            # should be attempted. This is currently not implemented yet.
            release:
              - added|modified|deleted:
                - .copier-answers.y?(a)ml
                - .github/workflows/**
                - CHANGELOG.md
                - pyproject.toml
                - setup.py

      - name: Echo Changed Files Output
        run: echo "${{ toJSON(steps.changed-files.outputs) }}"

      - name: Get All Changed Files As JSON
        id: changed-files-json
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        with:
          token: ${{ github.token }}
          list-files: json
          filters: |-
            all:
              - added|deleted|modified: '**'
