---
name: Pre-Commit

on:
  workflow_call:
    inputs:
      changed-files:
        required: true
        type: string
        description: JSON string containing information about changed files
      use-caches:
        required: false
        type: boolean
        default: true
        description: Whether dependency caches may be used. Disabled for release builds.

permissions:
  contents: read

jobs:
  Pre-Commit:
    name: Pre-Commit
    runs-on: ubuntu-24.04
    container:
      image: 'docker.io/library/python:3.11.17-slim-trixie@sha256:45037981b62b34b44602584fccbc4d884d5f7dc92c7ee86bb38a698a79fe1e51'

    steps:
      - name: Install System Deps
        run: |
          apt-get update
          apt-get install -y git gcc libc-dev
          git config --global --add safe.directory "$(pwd)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Pre-Commit Environments
        # Release builds must not use cached environments
        if: ${{ inputs.use-caches && !startsWith(github.ref, 'refs/tags/') }}
        # renovate:
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Pre-Commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit install --install-hooks

      - name: Check ALL Files On Branch
        if: github.event_name != 'pull_request' || fromJSON(inputs.changed-files)['pre-commit'] == 'true'
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Check Changed Files On PR
        # Skip when the previous step already checked all files
        if: github.event_name == 'pull_request' && fromJSON(inputs.changed-files)['repo'] == 'true' && fromJSON(inputs.changed-files)['pre-commit'] != 'true'
        run: |
          pre-commit run --show-diff-on-failure --color=always --files ${{ fromJSON(inputs.changed-files)['repo_files'] }}

      - name: Upload Exit Status
        if: always()
        uses: ./.github/actions/upload-exitstatus
