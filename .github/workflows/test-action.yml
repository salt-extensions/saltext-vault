      - name: Start VM
        uses: vmactions/almalinux-vm@926c2897e439c5f5042bf83fb93c0f64aeb2737d  # v1.0.1
        with:
          release: "${{ matrix.osrelease }}"
          envs: 'SKIP_REQUIREMENTS_INSTALL SALT_REQUIREMENT'
          custom-shell-name: almalinux
          # Cache the prepared VM image, keyed on the `prepare` script's hash
          cache-after-prepare: true
          prepare: |
            # gcc: sdist-only test dependencies (e.g. timelib on the
