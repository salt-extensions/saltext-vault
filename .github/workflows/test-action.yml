---
name: Testing

on:
  workflow_call:
    inputs:
      changed-files:
        required: true
        type: string
        description: JSON string of array of all changed files. Used for optimizing PR CI runtimes.
      use-caches:
        required: false
        type: boolean
        default: true
        description: Whether dependency caches may be used. Disabled for release builds.

jobs:
  Linux:
    name: Linux (${{ matrix.salt-version }}, ${{ matrix.python-version }}, ${{ matrix.container-image }}:${{ matrix.container-tag }}${{ matrix.internal-logic && ' [internal logic]' || '' }})
    runs-on: ubuntu-${{ matrix.osrelease }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        osrelease:
          - "24.04"
        include:
          - salt-version: "3006.28"
            python-version: "3.11"
            container-image: vault
            # Intentionally old release, must not be updated by renovate
            container-tag: "1.14.8"
            internal-logic: false
          - salt-version: "3008.3"
            python-version: "3.11"
            container-image: openbao
            # renovate: datasource=docker depName=openbao/openbao
            container-tag: "2.7.1"
            internal-logic: false
          - salt-version: "3008.3"
            python-version: "3.14"
            container-image: vault
            # renovate: datasource=docker depName=hashicorp/vault
            container-tag: "2.1.1"
            internal-logic: false
          - salt-version: "3008.3"
            python-version: "3.14"
            container-image: vault
            # renovate: datasource=docker depName=hashicorp/vault
            container-tag: "2.1.1"
            internal-logic: true

    env:
      TESTING_CONTAINER: ${{ matrix.container-image }}:${{ matrix.container-tag }}

    steps:
      - name: Generate Run ID
        run: |
          RUNID="$${{ github.job }}-${{ matrix.osrelease }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-${TESTING_CONTAINER//[:\/]/_}"
          echo "RUNID=${RUNID}" >> "$GITHUB_ENV"
          echo "Run ID: ${RUNID}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # coverage: Issue detecting commit SHA

      - name: Setup Vault
        # renovate:
        uses: eLco/setup-vault@1a8cc6f3c818a0e71b6fade4a922eeec95069edf  # v1.0.4
        with:
          vault_version: 2.1.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nox
        run: |
          python -m pip install --upgrade pip
          pip install "nox==$NOX_VERSION" "uv==$UV_VERSION"
        env:
          NOX_VERSION: '2026.8.17'
          UV_VERSION: '0.12.21'

      - name: Configure uv Cache Location
        # `runner.temp` is not available in job-level `env` definitions
        shell: bash
        run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"

      - name: Cache uv Wheels
        # Release builds must not use cached environments
        if: ${{ inputs.use-caches && !startsWith(github.ref, 'refs/tags/') }}
        # renovate:
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-salt${{ matrix.salt-version }}-${{ hashFiles('pyproject.toml', 'noxfile.py') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-salt${{ matrix.salt-version }}-

      - name: Install Test Requirements
        env:
          SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
        run: |
          nox --force-color -e tests-3 --install-only
      - name: Prune uv Cache
        # Release builds must not use cached environments
        if: ${{ inputs.use-caches && !startsWith(github.ref, 'refs/tags/') }}
        run: uv cache prune --ci

      - name: Test
        env:
          # Assume this list is not too long for an env var (around 2**16 bytes on Linux, half that on Windows)
          CHANGED_FILES: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'test:full') && inputs.changed-files || '' }}
          SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
          SKIP_REQUIREMENTS_INSTALL: "1"
        run: >-
          nox --force-color -e tests-3 -- -vv --instafail --${{ matrix.internal-logic && 'internal-logic-tests' || 'no-internal-logic' }}
          ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'test:full') && '--changed-files --allow-empty-runs' || '' }}
          tests/

      - name: Create CodeCov Flags
        if: always()
        id: codecov-flags
        run: |
          echo "flags=$(python -c "import sys; print('{},{},salt_{}'.format('${{ runner.os }}'.replace('-latest', ''), 'py{}{}'.format(*sys.version_info), '_'.join(str(v) for v in '${{ matrix.salt-version }}'.replace('==', '_').split('.'))))")" >> "$GITHUB_OUTPUT"

      - name: Upload Project Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-project.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ steps.codecov-flags.outputs.flags }},project
          name: ${{ env.RUNID }}-project
          use_oidc: true
          version: v11.3.1

      - name: Upload Tests Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ steps.codecov-flags.outputs.flags }},tests
          name: ${{ env.RUNID }}-tests
          use_oidc: true
          version: v11.3.1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtests-${{ env.RUNID }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: always() && matrix.salt-version != 'master' && !endsWith(matrix.salt-version, '.x')
        uses: ./.github/actions/upload-exitstatus
        with:
          name: ${{ env.RUNID }}

  Debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      SALT_REQUIREMENT: salt==${{ matrix.salt-version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {salt-version: "3006.28", python-version: "3.11", osrelease: "13"}
          - {salt-version: "3008.3", python-version: "3.14", osrelease: "13"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # coverage: Issue detecting commit SHA

      - name: Start VM
        uses: vmactions/debian-vm@626b64f9a6be64bbeaf3850f8bac2532d4e77db4  # v1.0.1
        with:
          release: "${{ matrix.osrelease }}"
          envs: 'SKIP_REQUIREMENTS_INSTALL SALT_REQUIREMENT'
          custom-shell-name: debian
          # Cache the prepared VM image, keyed on the `prepare` script's hash
          cache-after-prepare: true
          prepare: |
            apt-get update -y
            apt-get install -y ca-certificates python3-pip
            env PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install "uv==0.12.21"
            env UV_TOOL_BIN_DIR=/usr/local/bin uv tool install "nox==2026.8.17"

      - name: Install Test Requirements
        shell: debian {0}
        run: |
          nox --force-color -e tests-${{ matrix.python-version }} --install-only

      - name: Test
        shell: debian {0}
        env:
          SKIP_REQUIREMENTS_INSTALL: "1"
        run: |
          nox --force-color -e tests-${{ matrix.python-version }} -- -vv --instafail tests/

      - name: Upload Project Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-project.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ github.job }}-${{ matrix.osrelease }},project
          name: ${{ github.job }}-${{ matrix.osrelease }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-project
          use_oidc: true
          version: v11.3.1

      - name: Upload Tests Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ github.job }}-${{ matrix.osrelease }},tests
          name: ${{ github.job }}-${{ matrix.osrelease }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-tests
          use_oidc: true
          version: v11.3.1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtests-${{ github.job }}-${{ matrix.osrelease }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: always()
        uses: ./.github/actions/upload-exitstatus
        with:
          name: ${{ github.job }}-${{ matrix.osrelease }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}

  Alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # Salt and its dependencies are provided as system packages, which
      # the session venvs inherit. This makes the tests run against the
      # OS-packaged Salt release and avoids expensive source builds of
      # binary dependencies.
      VENV_SYSTEM_SITE_PACKAGES: '1'

    strategy:
      fail-fast: false
      matrix:
        osrelease:
          - "3.24"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # coverage: Issue detecting commit SHA

      - name: Start VM
        uses: vmactions/alpine-vm@bbc5d76bdbe2d3497bdd8c6c7f09c94aa01c785e  # v1.0.2
        with:
          release: "${{ matrix.osrelease }}"
          envs: 'SKIP_REQUIREMENTS_INSTALL VENV_SYSTEM_SITE_PACKAGES'
          custom-shell-name: alpine
          # Cache the prepared VM image, keyed on the `prepare` script's hash
          cache-after-prepare: true
          prepare: |
            apk add salt py3-pip
            env PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install "nox==2026.8.17"

      - name: Install Test Requirements
        shell: alpine {0}
        run: |
          nox --force-color -e tests-3 --install-only

      - name: Test
        shell: alpine {0}
        env:
          SKIP_REQUIREMENTS_INSTALL: "1"
        run: |
          nox --force-color -e tests-3 -- -vv --instafail tests/

      - name: Upload Project Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-project.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ github.job }}-${{ matrix.osrelease }},project
          name: ${{ github.job }}-${{ matrix.osrelease }}-project
          use_oidc: true
          version: v11.3.1

      - name: Upload Tests Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ github.job }}-${{ matrix.osrelease }},tests
          name: ${{ github.job }}-${{ matrix.osrelease }}-tests
          use_oidc: true
          version: v11.3.1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtests-${{ github.job }}-${{ matrix.osrelease }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: always()
        uses: ./.github/actions/upload-exitstatus
        with:
          name: ${{ github.job }}-${{ matrix.osrelease }}

  AlmaLinux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      SALT_REQUIREMENT: salt==${{ matrix.salt-version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {salt-version: "3006.28", python-version: "3.11", osrelease: "10"}
          - {salt-version: "3008.3", python-version: "3.14", osrelease: "10"}

    steps:
