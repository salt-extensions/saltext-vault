            dnf install -y ca-certificates python3-pip gcc
            env PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install "uv==0.12.21"
            env UV_TOOL_BIN_DIR=/usr/local/bin uv tool install "nox==2026.8.17"

      - name: Install Test Requirements
