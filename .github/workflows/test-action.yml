          version: v11.3.1

      - name: Upload Tests Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ github.job }}-${{ matrix.osrelease }},tests
          name: ${{ github.job }}-${{ matrix.osrelease }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-tests
          use_oidc: true
          version: v11.3.1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtests-${{ github.job }}-${{ matrix.osrelease }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: always()
        uses: ./.github/actions/upload-exitstatus
        with:
          name: ${{ github.job }}-${{ matrix.osrelease }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}

  Rocky-Linux:
